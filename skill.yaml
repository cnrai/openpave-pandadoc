# OpenPAVE PandaDoc Skill
# Query and manage PandaDoc documents securely using API key authentication

name: pandadoc
version: 1.1.1
description: Query and manage PandaDoc documents, templates, and e-signatures

author:
  name: cnrai
  url: https://github.com/cnrai

license: MIT
homepage: https://github.com/cnrai/openpave-pandadoc
repository: cnrai/openpave-pandadoc

# Execution pattern
pattern: sandbox
entrypoint: index.js

usage_notes: |
  IMPORTANT FOR AI AGENTS:
  
  Document Generation Rules:
  - ALWAYS get user approval before sending a document for signing — this is a legal/financial commitment
  - Always check fields/tokens on a template before creating documents — know what variables are needed
  - Use download to save signed documents to tmp/ for record-keeping
  
  Closing Workflow:
  1. When a founder confirms in chat/Discord, create the document from template
  2. Fill in all required fields/tokens
  3. Present the document details for final review
  4. Only send for signing after explicit approval
  5. Download the signed PDF when complete
  
  Audit Trail:
  - Use audit to verify document history and signing events
  - Always include audit trail info when reporting on deal status

# Available commands
commands:
  - name: list
    description: List documents with optional filters
    options:
      - -q, --query <query>
      - -s, --status <status>
      - -t, --tag <tag>
      - --template <templateId>
      - --folder <folderUuid>
      - -n, --count <number>
      - -p, --page <number>
      - --order <field>
      - --deleted
      - --created-from <date>
      - --created-to <date>
      - --modified-from <date>
      - --modified-to <date>
      - --completed-from <date>
      - --completed-to <date>
      - --summary

  - name: get
    description: Get document status by ID
    args:
      - <documentId>
    options:
      - --summary

  - name: details
    description: Get detailed document info (recipients, fields, totals)
    args:
      - <documentId>
    options:
      - --summary

  - name: download
    description: Download document as PDF
    args:
      - <documentId>
    options:
      - -o, --output <file>
      - --watermark
      - --protected

  - name: templates
    description: List templates
    options:
      - -q, --query <query>
      - -t, --tag <tag>
      - -n, --count <number>
      - -p, --page <number>
      - --deleted
      - --summary

  - name: folders
    description: List document folders
    options:
      - --parent <uuid>
      - -n, --count <number>
      - -p, --page <number>
      - --summary

  - name: me
    description: Get current user/member info
    options:
      - --summary

  - name: audit
    description: Get document audit trail
    args:
      - <documentId>
    options:
      - --summary

  - name: fields
    description: List document fields/tokens
    args:
      - <documentId>
    options:
      - --summary

  - name: send
    description: Send document for signing
    args:
      - <documentId>
    options:
      - -m, --message <text>
      - --subject <subject>
      - --silent
      - --summary

# Token configuration for secure sandbox access
tokens:
  pandadoc:
    type: api_key
    description: PandaDoc API key for authentication
    domains:
      - api.pandadoc.com
    env:
      required:
        - PANDADOC_API_KEY
    config:
      env: PANDADOC_API_KEY
      type: api_key
      domains:
        - api.pandadoc.com
      placement:
        type: header
        name: Authorization
        format: "API-Key {token}"

# Sandbox permissions
permissions:
  fs.read:
    - tmp/*
  fs.write:
    - tmp/*
  network:
    - api.pandadoc.com
  modules:
    - fs
    - path
  system: []

# Platform compatibility
platforms:
  - darwin
  - linux
  - win32

engines:
  node: ">=16.0.0"

# Metadata
keywords:
  - pandadoc
  - documents
  - esign
  - e-signature
  - contracts
  - proposals
  - templates
  - pdf

category: productivity
icon: "\U0001F4DD"
